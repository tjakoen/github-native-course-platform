name: Deploy Course Console to GitHub Pages

# The Course Console (console/) is a data-free STATIC SHELL: all gradebook data
# is fetched at view time from api.github.com with the teacher's own PAT (stored
# in the browser). The only build step is baking the GRAIN theme from the
# @tjakoen/grain package into theme.css. A tripwire step fails the deploy if
# anything that looks like student data ends up in the artifact - this matters
# even more here because live teacher-repo clones sit (gitignored) under
# console/classes/ in local checkouts.

on:
  push:
    branches: [main]
    paths:
      - "console/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  packages: read   # to install @tjakoen/grain from GitHub Packages

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # @tjakoen/grain lives in GitHub Packages; auth the scope with the workflow
      # token. The committed console/.npmrc already routes @tjakoen -> npm.pkg.github.com.
      # NOTE: the @tjakoen/grain package must grant this repo Actions access
      # (package settings -> Manage Actions access), or this install 403s.
      - run: echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" >> .npmrc
      # playwright is a devDependency (the local e2e harness); it is never run in
      # CI, so skip its browser download to keep the deploy install fast.
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - run: node scripts/bake-theme.mjs
      - name: Assemble dist
        run: |
          mkdir -p dist
          cp -R site/. dist/
      - name: Verify (theme baked + no data in the artifact)
        run: |
          test -s dist/theme.css || { echo "theme.css missing/empty"; exit 1; }
          test -s dist/index.html
          test -s dist/app.mjs
          # PII tripwire: the artifact must never contain gradebook data.
          # grades.csv rows carry studentNumber + fullName columns; any CSV or
          # per-student note sneaking into dist/ is a hard failure.
          if grep -rlE 'studentNumber,|fullName,|githubAccount,' dist/ --include='*.csv' 2>/dev/null | grep -q .; then
            echo "::error::gradebook CSV found in artifact"; exit 1; fi
          if find dist -name 'grades.csv' -o -name 'shots-manifest.json' -o -path '*dashboard-assets*' -o -name 'student.json' -o -path '*classes*' | grep -q .; then
            echo "::error::local data artifact found in dist/"; exit 1; fi
          # The search index is client-built in memory ONLY; a search.json at rest
          # would mean student data leaked into the artifact.
          if test -e dist/search.json; then
            echo "::error::search.json must never ship (search index is in-memory only)"; exit 1; fi
          # No JSON in the artifact may carry gradebook identity columns (tours,
          # fixtures, any future static data included).
          if grep -rlE '"studentNumber"|"fullName"|"githubAccount"' dist/ --include='*.json' 2>/dev/null | grep -q .; then
            echo "::error::student-identity fields found in a shipped JSON"; exit 1; fi
          test -s dist/vendor/grain/lightbox.js || { echo "::error::grain vendor scripts missing"; exit 1; }
          test -s dist/vendor/crumb.js -a -s dist/crumb/tours/first-run.json || { echo "::error::crumb tour client or tour data missing"; exit 1; }
          # Intent byte-compat: the six prompt builders must match the golden
          # fixtures (the grading skills parse these formats).
          node scripts/check-intents.mjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: console/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
